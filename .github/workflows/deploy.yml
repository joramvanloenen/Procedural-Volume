name: Test Procedural Volume
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check vascular-geometry.js
          node --check architecture.js
          node --check simulation.js
          node --check main.js
          node --check worker.js
      - name: Verify scanner controls and visual resolution
        run: node tests/ui-smoke.mjs
      - name: Verify anatomical vascular routing and conservation
        run: node tests/smoke.mjs
